name: Validate fixtures

on:
  # Branch pushes are covered by the pull_request event; running both
  # doubled every PR's macOS jobs. Push only runs on the long-lived branches.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A new push to a PR supersedes the previous run. Pushes to main/develop
# are never cancelled, so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_fixtures: ${{ steps.select.outputs.has_fixtures }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select fixtures
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci-select-fixtures.sh --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --github-output

  validate:
    name: ${{ matrix.fixture }} (Tuist ${{ matrix.tuist }})
    needs: changes
    if: needs.changes.outputs.has_fixtures == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      XDG_CACHE_HOME: /tmp/tuist/cache
      XDG_STATE_HOME: /tmp/tuist/state
      XDG_DATA_HOME: /tmp/tuist/data
    steps:
      - uses: actions/checkout@v6

      - name: Install fixture-pinned Tuist
        uses: jdx/mise-action@v4
        with:
          tool_versions: |
            tuist ${{ matrix.tuist }}
          cache: true

      - name: Verify Tuist pin
        working-directory: tests/fixtures/${{ matrix.fixture }}
        run: |
          test "$(mise exec -- tuist version)" = "${{ matrix.tuist }}"

      - name: Pre-boot simulator
        run: |
          SIMULATOR_ID="$(./scripts/ci-pick-simulator.sh)"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true

      - name: Resolve dependencies
        working-directory: tests/fixtures/${{ matrix.fixture }}
        run: mise exec -- tuist ${{ matrix.resolve_cmd }}

      - name: Generate project
        working-directory: tests/fixtures/${{ matrix.fixture }}
        run: mise exec -- tuist generate --no-open

      - name: Build and test
        working-directory: tests/fixtures/${{ matrix.fixture }}
        env:
          TEST_SCHEMES: ${{ matrix.test_schemes }}
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          for scheme in $TEST_SCHEMES; do
            xcodebuild build-for-testing \
              -workspace "${{ matrix.workspace }}.xcworkspace" \
              -scheme "$scheme" \
              -destination "id=$SIMULATOR_ID"
            xcodebuild test-without-building \
              -workspace "${{ matrix.workspace }}.xcworkspace" \
              -scheme "$scheme" \
              -destination "id=$SIMULATOR_ID"
          done

  fixtures-ok:
    name: fixtures-ok
    if: always()
    needs: [changes, validate]
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
    steps:
      - name: Aggregate fixture results
        run: |
          echo "changes=$CHANGES_RESULT validate=$VALIDATE_RESULT"
          test "$CHANGES_RESULT" = "success"
          case "$VALIDATE_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
